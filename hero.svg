<svg width="900" height="380" viewBox="0 0 900 380"
    xmlns="http://www.w3.org/2000/svg"
    style="overflow:visible">

    <defs>

        <style>
            .name {
                font-family: 'Segoe UI', Arial, sans-serif;
                font-weight: 800;
                font-size: 54px;
                letter-spacing: 6px;
                fill: #fff;
            }

            .sub {
                font-family: 'Segoe UI', Arial, sans-serif;
                font-weight: 600;
                font-size: 17px;
                letter-spacing: 1px;
                fill: #f5a623;
            }

            .ach {
                font-family: 'Fira Code', monospace;
                font-weight: 600;
                font-size: 17px;
                fill: #ffb347;
            }

            .status-text {
                font-family: 'Segoe UI', Arial, sans-serif;
                font-weight: 700;
                font-size: 14px;
                letter-spacing: 2px;
                fill: #fff;
            }

            .corner {
                stroke: #f5a623;
                stroke-width: 2;
                fill: none;
                opacity: .8;
            }

            .glowbar {
                animation: pulse 2.6s infinite;
            }

            .trace {
                fill: none;
                stroke: #f5a623;
                stroke-width: 2;
                stroke-dasharray: 30 250;
                animation: travel 3.2s linear infinite;
            }

            .clip rect {
                transform-origin: center;
            }

            .clip1 rect {
                animation: type1 12s infinite;
            }

            .clip2 rect {
                animation: type2 12s infinite;
            }

            .clip3 rect {
                animation: type3 12s infinite;
            }


            @keyframes travel {
                to {
                    stroke-dashoffset: -400;
                }
            }

            @keyframes pulse {
                50% {
                    opacity: .25;
                }
            }

            @keyframes scan {
                from {
                    transform: translateY(-40px);
                }

                to {
                    transform: translateY(400px);
                }
            }

            @keyframes glitch {
                0%, 92%, 100% {
                    transform: translate(0);
                    opacity: 0;
                }

                93% {
                    transform: translate(-3px, 1px);
                    opacity: .7;
                }

                95% {
                    transform: translate(3px, -1px);
                    opacity: .7;
                }

                97% {
                    transform: translate(-2px);
                    opacity: .5;
                }
            }

            @keyframes type1 {
                0%, 10% {
                    transform: scaleX(0);
                }

                20%, 35% {
                    transform: scaleX(1);
                }

                45%, 100% {
                    transform: scaleX(0);
                }
            }

            @keyframes type2 {
                0%, 40% {
                    transform: scaleX(0);
                }

                50%, 65% {
                    transform: scaleX(1);
                }

                75%, 100% {
                    transform: scaleX(0);
                }
            }

            @keyframes type3 {
                0%, 70% {
                    transform: scaleX(0);
                }

                80%, 95% {
                    transform: scaleX(1);
                }

                100% {
                    transform: scaleX(0);
                }
            }

            .name-glow {
    animation: nameReveal 1.2s ease-out forwards;
}

.name-main {
    animation: nameSharp 1.2s ease-out forwards;
}

@keyframes nameReveal {
    0% {
        opacity: 0;
        filter: blur(8px);
    }

    60% {
        opacity: .6;
        filter: blur(3px);
    }

    100% {
        opacity: .35;
        filter: blur(2px);
    }
}


@keyframes nameSharp {
    0% {
        opacity: 0;
        filter: blur(6px);
    }

    100% {
        opacity: 1;
        filter: blur(0);
    }
}
        </style>


        <!-- Background -->
        <radialGradient id="bg">
            <stop stop-color="#1c0a0a"/>
            <stop offset="1" stop-color="#020103"/>
        </radialGradient>


        <!-- Frame -->
        <linearGradient id="frame">
            <stop stop-color="#f5a623"/>
            <stop offset="1" stop-color="#dc2626"/>
        </linearGradient>


        <!-- Scan -->
        <linearGradient id="scan">
            <stop stop-color="white" stop-opacity="0"/>
            <stop offset=".5" stop-color="white" stop-opacity=".05"/>
            <stop offset="1" stop-color="white" stop-opacity="0"/>
        </linearGradient>


        <!-- Filters -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="4"/>
        </filter>

        <filter id="soft">
            <feGaussianBlur stdDeviation="2"/>
        </filter>


        <!-- Text Animation Clips -->
        <clipPath id="clip1" class="clip1">
            <rect x="120" y="205" width="660" height="40"/>
        </clipPath>

        <clipPath id="clip2" class="clip2">
            <rect x="120" y="205" width="660" height="40"/>
        </clipPath>

        <clipPath id="clip3" class="clip3">
            <rect x="120" y="205" width="660" height="40"/>
        </clipPath>

    </defs>


    <!-- BACKGROUND -->
    <rect width="900" height="380"
        rx="18"
        fill="url(#bg)"/>


    <rect x="3" y="3"
        width="894"
        height="374"
        rx="16"
        fill="none"
        stroke="url(#frame)"
        stroke-width="2"/>


    <!-- CORNER -->
    <path class="corner" d="M24 60V24H60"/>
    <path class="corner" d="M876 60V24H840"/>
    <path class="corner" d="M24 320V356H60"/>
    <path class="corner" d="M876 320V356H840"/>


    <!-- SCAN EFFECT -->
    <rect width="900"
        height="40"
        fill="url(#scan)"
        style="animation: scan 6s linear infinite"/>


   <!-- NAME GLOW -->
<text x="450"
    y="110"
    text-anchor="middle"
    class="name name-glow"
    fill="#ffb347">
    Bayu Adi Saputra
</text>


<!-- NAME MAIN -->
<text x="450"
    y="110"
    text-anchor="middle"
    class="name name-main">
    Bayu Adi Saputra
</text>


<!-- GLITCH -->
<text x="447"
    y="110"
    text-anchor="middle"
    class="name"
    fill="#ffb347"
    style="animation: glitch 9s infinite">
    Bayu Adi Saputra
</text>


<text x="453"
    y="110"
    text-anchor="middle"
    class="name"
    fill="#dc2626"
    style="animation: glitch 9s infinite .15s">
    Bayu Adi Saputra
</text>


    <!-- SUBTITLE -->
    <text x="450"
        y="146"
        text-anchor="middle"
        class="sub">
        WEB DEVELOPER · EDITING · HARDWARE
    </text>


    <rect x="380"
        y="164"
        width="140"
        height="3"
        fill="#ffb347"
        class="glowbar"/>


    <!-- ACHIEVEMENTS -->
    <text x="450"
        y="235"
        text-anchor="middle"
        class="ach"
        clip-path="url(#clip1)">
        1ST HONORABLE MENTION — LKS IT NETWORK SYSTEM
    </text>


    <text x="450"
        y="235"
        text-anchor="middle"
        class="ach"
        clip-path="url(#clip2)">
        Top 10 Participants — Lampung Provincial Meme Competition
    </text>


    <text x="450"
        y="235"
        text-anchor="middle"
        class="ach"
        clip-path="url(#clip3)">
        SOFTWARE DEVELOPMENT With Qualification PROGRAM ANALYST
    </text>


    <!-- STATUS -->
    <rect x="356"
        y="280"
        width="188"
        height="42"
        rx="10"
        fill="#2a1006"
        stroke="#f5a623"/>


    <rect x="356"
        y="280"
        width="188"
        height="42"
        rx="10"
        class="trace"/>


    <circle cx="378"
        cy="301"
        r="4"
        fill="#22c55e"/>


    <text x="454"
        y="306"
        text-anchor="middle"
        class="status-text">
        OPEN TO WORK
    </text>

</svg>